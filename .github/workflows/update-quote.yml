name: Update Daily Quote

on:
  schedule:
    - cron: "0 3 * * *" # runs once a day (3 AM UTC ≈ 8:30 AM IST)
  workflow_dispatch: {}

jobs:
  update-quote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch a new quote
        id: quote
        run: |
          RESPONSE=$(curl -s "https://zenquotes.io/api/random")
          QUOTE_TEXT=$(echo "$RESPONSE" | python3 -c "import sys, json; d=json.load(sys.stdin)[0]; print(d['q'])")
          QUOTE_AUTHOR=$(echo "$RESPONSE" | python3 -c "import sys, json; d=json.load(sys.stdin)[0]; print(d['a'])")
          echo "text=$QUOTE_TEXT" >> $GITHUB_OUTPUT
          echo "author=$QUOTE_AUTHOR" >> $GITHUB_OUTPUT

      - name: Update README between markers
        run: |
          python3 - <<EOF
          import re

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          new_quote = '<i>"${{ steps.quote.outputs.text }}" — ${{ steps.quote.outputs.author }}</i>'

          pattern = re.compile(r"(<!-- QUOTE-START -->)(.*?)(<!-- QUOTE-END -->)", re.DOTALL)
          content = pattern.sub(rf"\1\n{new_quote}\n\3", content)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(content)
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update daily quote"
          git push
